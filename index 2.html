<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Batman Ledger">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Batman Rental Balance Ledger</title>
<style>
:root{--paper:#f2f1e8;--stripe:#e6e4d6;--line:#c7c3a8;--ink:#121212;--soft:#5a5a52;--card:#fffefb;--blue:#1f4e79;--red:#9a2e1c;--redbg:#f5e4df;--orange:#c25a2a;--orangebg:#fde9d9;--yellow:#ffd300;--green:#2e6b3e;--greenbg:#e6efe0;--bat:#0a0a0a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:repeating-linear-gradient(to bottom,var(--paper) 0 40px,var(--stripe) 40px 80px)}
button,input,select,textarea{font:inherit}button{border:0}.app{max-width:1100px;margin:auto;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:var(--bat);color:#fff;padding:12px 14px 9px;border-bottom:4px solid var(--yellow);padding-top:max(12px,env(safe-area-inset-top))}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:9px}.bat{width:30px;height:19px;background:var(--yellow);clip-path:polygon(0 50%,15% 0,35% 40%,50% 15%,65% 40%,85% 0,100% 50%,85% 85%,65% 60%,50% 85%,35% 60%,15% 85%)}
.summary{font:11px ui-monospace,monospace;color:#ccc;margin-top:4px}.tabs{display:flex;gap:6px;margin-top:9px;overflow:auto;padding-bottom:1px}.tab{white-space:nowrap;background:#222;color:#eee;border:1px solid #444;border-radius:18px;padding:7px 11px;font-size:12px;font-weight:700}.tab.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.controls{padding:10px 14px 0;display:flex;gap:7px;flex-wrap:wrap}.controls>*{min-height:36px}.controls input,.controls select{flex:1;min-width:130px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:8px 10px;font-size:13px}textarea{min-height:70px;resize:vertical}
.btn{padding:8px 11px;border-radius:6px;font-weight:700;cursor:pointer}.primary{background:var(--bat);color:var(--yellow)}.yellow{background:var(--yellow);color:#000}.outline{background:var(--card);border:1px solid var(--line)}.danger{background:var(--red);color:white}.green{background:var(--green);color:white}
.alert{margin:10px 14px 0;padding:10px 12px;border-radius:7px;font-size:12px;line-height:1.45}.late{background:var(--redbg);color:var(--red);border:1px solid #e8b4a8}.due{background:var(--greenbg);border:1px solid #b7ceb9}.maint{background:var(--orangebg);color:var(--orange);border:1px solid #e9c5a8}.info{background:#fff7cc;border:1px solid #e9d97a;color:#665d00}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin:11px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:11px 12px}.metric .lab{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--soft);font-weight:800}.metric .val{font:700 17px ui-monospace,monospace;margin-top:3px}.metric .sub{font-size:10px;color:var(--soft)}
.section{margin:11px 14px}.section h2{font-size:15px;margin:0 0 7px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.muted{color:var(--soft);font-size:11px}.mono{font-family:ui-monospace,monospace}.badge{font:700 9px ui-monospace,monospace;text-transform:uppercase;border:2px solid;padding:2px 6px;border-radius:3px;white-space:nowrap}.b-paid{color:var(--blue);border-color:var(--blue)}.b-due{color:var(--blue);background:#e8eff5;border-color:var(--blue)}.b-late{color:var(--red);background:var(--redbg);border-color:var(--red)}.b-emergency{color:#fff;background:var(--red);border-color:var(--red)}.b-urgent{color:#fff;background:var(--orange);border-color:var(--orange)}.b-high{background:#fff0a8;border-color:#b68a00}.b-medium{background:var(--blue);color:white;border-color:var(--blue)}.b-low{background:#93a08d;color:white;border-color:#93a08d}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions .btn{font-size:11px;padding:6px 8px}
.tablewrap{overflow:auto;margin:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}th{background:var(--stripe);padding:8px;text-align:left;font-size:9px;text-transform:uppercase;position:sticky;top:0}td{padding:7px 8px;border-top:1px solid #e7e7df;vertical-align:top}.inc{color:var(--blue);font-weight:700}.exp{color:var(--red);font-weight:700}
.form{margin:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.field label{display:block;font-size:9px;text-transform:uppercase;color:var(--soft);font-weight:800;margin-bottom:3px}.full{grid-column:1/-1}
.empty{text-align:center;padding:28px;color:var(--soft);font-size:12px}.dangertext{color:var(--red)}.oktext{color:var(--green)}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:var(--card);width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}.modalbox h2{margin:0 0 10px;font-size:18px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:#111;color:white;padding:9px 13px;border-radius:20px;font-size:12px;display:none}
footer{position:fixed;bottom:0;left:0;right:0;background:#111;color:#ddd;text-align:center;font-size:10px;padding:6px;z-index:15}
@media(min-width:700px){.modal{align-items:center}.modalbox{border-radius:10px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1><span class="bat"></span> BATMAN RENTAL BALANCE LEDGER</h1>
<div id="summary" class="summary"></div>
<div id="tabs" class="tabs"></div>
</header>
<div id="controls" class="controls"></div>
<div id="alerts"></div>
<main id="content"></main>
</div>
<footer>Offline-ready • Changes save automatically on this device</footer>
<div id="modal"></div><div id="toast" class="toast"></div>
<script>
const KEY='batman-ledger-v3';
let db=JSON.parse(localStorage.getItem(KEY)||'{"properties":[],"maintenance":[],"expenses":[],"incomes":[],"settings":{"manager":""}}');
if(!db.properties)db.properties=[];if(!db.maintenance)db.maintenance=[];if(!db.expenses)db.expenses=[];if(!db.incomes)db.incomes=[];
let state={tab:'dashboard',search:'',rent:'all',urgency:'all',prop:'all',cat:'all',year:'all',devDay:null};
const $=id=>document.getElementById(id), money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){let d=new Date();return state.devDay?new Date(d.getFullYear(),d.getMonth(),state.devDay):d}
function monthKey(d=today()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function annual(amount,f){return f==='monthly'?amount*12:f==='quarterly'?amount*4:f==='annual'?amount:amount}
function propStatus(p){let d=today(),day=d.getDate();if(p.lastPaidMonth===monthKey(d))return['paid','Paid',0];if(day===1)return['due','Due today',0];let n=day-1;return day<=5?['due',n+' '+(n===1?'day':'days')+' past due']:['late',n+' days LATE']}
function depInterest(p){if(!p.depositAmount||!p.depositDate)return{interest:0,days:0};let days=Math.max(0,Math.floor((today()-new Date(p.depositDate))/86400000)),rate=Number(p.depositRate||0.015);return{interest:Number(p.depositAmount)*rate*days/365,days}}
function prop(idv){return db.properties.find(p=>p.id===idv)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function render(){renderTabs();renderSummary();renderControls();renderAlerts();({dashboard:renderDashboard,rent:renderRent,maintenance:renderMaintenance,accounting:renderAccounting,deposits:renderDeposits}[state.tab])()}
function renderTabs(){let late=db.properties.filter(p=>propStatus(p)[0]==='late').length,open=db.maintenance.filter(m=>m.status!=='completed').length,dep=db.properties.reduce((a,p)=>a+Number(p.depositAmount||0),0);$('tabs').innerHTML=[['dashboard','Dashboard'],['rent','Rent '+(late?'('+late+' late)':'')],['maintenance','Maintenance ('+open+')'],['accounting','Balance Sheet'],['deposits','Deposits '+(dep?money(dep):'')]].map(x=>`<button class="tab ${state.tab===x[0]?'active':''}" onclick="state.tab='${x[0]}';render()">${x[1]}</button>`).join('')}
function renderSummary(){let rent=db.properties.reduce((a,p)=>a+Number(p.rent||0),0),mort=db.expenses.filter(e=>e.category==='mortgage').reduce((a,e)=>a+annual(e.amount,e.frequency),0),late=db.properties.filter(p=>propStatus(p)[0]==='late').length,pend=db.maintenance.filter(m=>m.status!=='completed').reduce((a,m)=>a+Number(m.cost||0),0),interest=db.properties.reduce((a,p)=>a+depInterest(p).interest,0);$('summary').innerHTML=`${db.properties.length} props • ${money(rent)}/mo rent • ${money(mort)}/yr mortgage • ${late?late+' late':'rent current'} • ${money(pend)} open repairs • ${money(interest)} deposit interest accrued`}
function renderControls(){let opts=db.properties.map(p=>`<option value="${p.id}">${esc(p.address)}</option>`).join('');if(state.tab==='dashboard')$('controls').innerHTML=`<input placeholder="Search properties" value="${esc(state.search)}" oninput="state.search=this.value;renderDashboard()"><select onchange="state.devDay=this.value?+this.value:null;render()"><option value="">Today (${today().getDate()})</option><option value="1">Simulate 1st</option><option value="6">Simulate 6th (late)</option></select><button class="btn outline" onclick="backup()">Backup</button><button class="btn outline" onclick="restore()">Restore</button>`;else if(state.tab==='rent')$('controls').innerHTML=`<input placeholder="Search address/tenant" value="${esc(state.search)}" oninput="state.search=this.value;renderRent()"><select onchange="state.rent=this.value;renderRent()"><option value="all">All rent</option><option value="due">Due</option><option value="late">Late</option><option value="paid">Paid</option></select><button class="btn primary" onclick="openProperty()">+ Property</button>`;else if(state.tab==='maintenance')$('controls').innerHTML=`<input placeholder="Search repairs" value="${esc(state.search)}" oninput="state.search=this.value;renderMaintenance()"><select onchange="state.urgency=this.value;renderMaintenance()"><option value="all">All urgency</option><option>emergency</option><option>urgent</option><option>high</option><option>medium</option><option>low</option></select><select onchange="state.prop=this.value;renderMaintenance()"><option value="all">All properties</option>${opts}</select><button class="btn primary" onclick="openMaintenance()">+ Repair</button>`;else if(state.tab==='accounting')$('controls').innerHTML=`<select onchange="state.prop=this.value;renderAccounting()"><option value="all">All properties</option>${opts}</select><select onchange="state.cat=this.value;renderAccounting()"><option value="all">All categories</option><option value="rent">Rent</option><option value="tax">Tax</option><option value="insurance">Insurance</option><option value="mortgage">Mortgage</option><option value="utilities_water">Water</option><option value="utilities_sewer">Sewer</option><option value="utilities_garbage">Garbage</option><option value="maintenance">Maintenance</option><option value="other">Other</option></select><button class="btn yellow" onclick="openExpense()">+ Expense</button><button class="btn outline" onclick="exportCSV()">CSV</button>`;else $('controls').innerHTML=`<input placeholder="Search tenant/property" value="${esc(state.search)}" oninput="state.search=this.value;renderDeposits()"><button class="btn yellow" onclick="state.tab='rent';render()">Manage deposits in Properties</button>`}
function renderAlerts(){let late=db.properties.filter(p=>propStatus(p)[0]==='late'),em=db.maintenance.filter(m=>m.necessity==='emergency'&&m.status!=='completed'),di=db.properties.filter(p=>depInterest(p).days>=365);let h='';if(late.length)h+=`<div class="alert late"><b>⚠ ${late.length} rent payment(s) are late after the 5th — ${money(late.reduce((a,p)=>a+Number(p.rent||0),0))} outstanding.</b></div>`;if(em.length)h+=`<div class="alert maint"><b>🔧 ${em.length} emergency repair(s) open — ${money(em.reduce((a,m)=>a+Number(m.cost||0),0))} estimated.</b></div>`;if(di.length)h+=`<div class="alert info"><b>💰 ${di.length} deposit(s) held 1+ year — ${money(di.reduce((a,p)=>a+depInterest(p).interest,0))} accrued interest at the entered rate.</b><br><span>Interest rules can depend on the property’s California city/county. Verify local requirements before paying or withholding interest.</span></div>`;$('alerts').innerHTML=h}
function metric(label,val,sub=''){$('content').innerHTML+=`<div class="card metric"><div class="lab">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`}
function renderDashboard(){let q=state.search.toLowerCase(),ps=db.properties.filter(p=>(p.address+' '+p.tenant).toLowerCase().includes(q)),rent=ps.reduce((a,p)=>a+Number(p.rent||0),0),open=db.maintenance.filter(m=>m.status!=='completed'),income=db.incomes.reduce((a,i)=>a+Number(i.amount||0),0),expenses=db.expenses.reduce((a,e)=>a+annual(Number(e.amount||0),e.frequency),0);$('content').innerHTML=`<div class="grid"></div>`;let g=$('content').firstChild;g.innerHTML=`<div class="card metric"><div class="lab">Monthly Rent</div><div class="val">${money(rent)}</div><div class="sub">${ps.length} matching properties</div></div><div class="card metric"><div class="lab">Annual Rent Potential</div><div class="val">${money(rent*12)}</div></div><div class="card metric"><div class="lab">Open Repairs</div><div class="val">${open.length}</div><div class="sub">${money(open.reduce((a,m)=>a+Number(m.cost||0),0))} estimated</div></div><div class="card metric"><div class="lab">Annual Expenses</div><div class="val">${money(expenses)}</div></div>`;$('content').innerHTML+=`<div class="section"><h2>Property Snapshot</h2></div>`;ps.forEach(p=>{let s=propStatus(p);$('content').lastChild.insertAdjacentHTML('afterend',propertyCard(p,s))});if(!ps.length)$('content').innerHTML+=`<div class="empty">No properties yet. Tap <b>+ Property</b> under Rent to start.</div>`}
function propertyCard(p,s){let ci=depInterest(p);return `<div class="card ${s[0]==='late'?'late':''}"><div class="row"><div><b>${esc(p.address)}</b><div class="muted">${esc(p.tenant||'No tenant')} • ${esc(p.phone||'')}</div></div><span class="badge b-${s[0]}">${s[1]}</span></div><div class="row" style="margin-top:7px"><span class="mono">${money(p.rent)}/mo</span><span class="muted">Deposit ${money(p.depositAmount||0)}</span></div>${p.notes?`<div class="muted" style="margin-top:6px">${esc(p.notes)}</div>`:''}<div class="actions"><button class="btn yellow" onclick="markPaid('${p.id}')">Mark Rent Paid</button><button class="btn outline" onclick="openProperty('${p.id}')">Edit</button><button class="btn outline" onclick="quickRepair('${p.id}')">Repair</button></div>${ci.interest?`<div class="muted" style="margin-top:6px">Deposit interest accrued: <b>${money(ci.interest)}</b></div>`:''}</div>`}
function renderRent(){let q=state.search.toLowerCase(),ps=db.properties.filter(p=>(p.address+' '+p.tenant).toLowerCase().includes(q)).filter(p=>state.rent==='all'||propStatus(p)[0]===state.rent);$('content').innerHTML=ps.map(p=>propertyCard(p,propStatus(p))).join('')||`<div class="empty">No matching properties.</div>`}
function renderMaintenance(){let q=state.search.toLowerCase(),ms=db.maintenance.filter(m=>(m.title+' '+m.description+' '+(prop(m.propertyId)?.address||'')).toLowerCase().includes(q)).filter(m=>state.urgency==='all'||m.necessity===state.urgency).filter(m=>state.prop==='all'||m.propertyId===state.prop);$('content').innerHTML=ms.map(m=>{let p=prop(m.propertyId);return `<div class="card"><div class="row"><div><b>${esc(m.title)}</b><div class="muted">${esc(p?.address||'Unassigned')} • ${esc(m.vendor||'No vendor')}</div></div><span class="badge b-${m.necessity}">${m.necessity}</span></div><div style="margin-top:7px">${esc(m.description||'')}</div><div class="muted" style="margin-top:6px">Status: <b>${esc(m.status)}</b> • Estimate: <b>${money(m.cost)}</b> • ${esc(m.dueDate||'No due date')}</div><div class="actions"><button class="btn outline" onclick="openMaintenance('${m.id}')">Edit</button><button class="btn green" onclick="completeMaintenance('${m.id}')">Complete</button><button class="btn danger" onclick="deleteMaintenance('${m.id}')">Delete</button></div></div>`}).join('')||`<div class="empty">No repairs found.</div>`}
function renderAccounting(){let rows=[...db.expenses.map(e=>({...e,type:'Expense'})),...db.incomes.map(i=>({...i,type:'Income'}))];rows=rows.filter(x=>state.prop==='all'||x.propertyId===state.prop).filter(x=>state.cat==='all'||x.category===state.cat);let inc=rows.filter(x=>x.type==='Income').reduce((a,x)=>a+Number(x.amount||0),0),exp=rows.filter(x=>x.type==='Expense').reduce((a,x)=>a+annual(Number(x.amount||0),x.frequency),0);$('content').innerHTML=`<div class="grid"><div class="card metric"><div class="lab">Income Entered</div><div class="val">${money(inc)}</div></div><div class="card metric"><div class="lab">Annualized Expenses</div><div class="val">${money(exp)}</div></div><div class="card metric"><div class="lab">Net</div><div class="val">${money(inc-exp)}</div></div></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Property</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Frequency</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(prop(x.propertyId)?.address||'')}</td><td class="${x.type==='Income'?'inc':'exp'}">${x.type}</td><td>${esc(x.category)}</td><td>${esc(x.description||'')}</td><td>${money(x.amount)}</td><td>${esc(x.frequency||'one-time')}</td><td><button class="btn danger" onclick="deleteAccounting('${x.type}','${x.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">No accounting entries.</td></tr>`}</tbody></table></div>`}
function renderDeposits(){let q=state.search.toLowerCase(),ps=db.properties.filter(p=>(p.address+' '+p.tenant).toLowerCase().includes(q)),total=ps.reduce((a,p)=>a+Number(p.depositAmount||0),0),interest=ps.reduce((a,p)=>a+depInterest(p).interest,0);$('content').innerHTML=`<div class="grid"><div class="card metric"><div class="lab">Deposits Held</div><div class="val">${money(total)}</div></div><div class="card metric"><div class="lab">Accrued Interest</div><div class="val">${money(interest)}</div><div class="sub">Using each property rate</div></div></div>`+ps.map(p=>{let c=depInterest(p);return `<div class="card"><div class="row"><div><b>${esc(p.tenant||'No tenant')}</b><div class="muted">${esc(p.address)}</div></div><span class="mono">${money(p.depositAmount||0)}</span></div><div class="muted" style="margin-top:7px">Held ${c.days} days • Rate ${(Number(p.depositRate||.015)*100).toFixed(2)}% • Accrued ${money(c.interest)}</div></div>`}).join('')}
function formField(label,name,value,type='text',cls=''){return `<div class="field ${cls}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value??'')}"></div>`}
function openModal(title,html){$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><h2>${title}</h2>${html}</div></div>`}
function closeModal(){$('modal').innerHTML=''}
function openProperty(pid){let p=prop(pid)||{};openModal(pid?'Edit Property':'Add Property',`<form onsubmit="saveProperty(event,'${pid||''}')"><div class="formgrid">${formField('Address','address',p.address)}${formField('Tenant','tenant',p.tenant)}${formField('Phone','phone',p.phone,'tel')}${formField('Monthly Rent','rent',p.rent,'number')}${formField('Deposit Amount','depositAmount',p.depositAmount,'number')}${formField('Deposit Date','depositDate',p.depositDate,'date')}${formField('Deposit Interest Rate','depositRate',p.depositRate??.015,'number')} ${formField('Last Paid Month (YYYY-MM)','lastPaidMonth',p.lastPaidMonth)}<div class="field full"><label>Notes</label><textarea name="notes">${esc(p.notes||'')}</textarea></div></div><div class="actions"><button class="btn yellow">Save Property</button><button type="button" class="btn outline" onclick="closeModal()">Cancel</button>${pid?`<button type="button" class="btn danger" onclick="deleteProperty('${pid}')">Delete</button>`:''}</div></form>`)}
function saveProperty(e,pid){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);['rent','depositAmount','depositRate'].forEach(k=>o[k]=Number(o[k]||0));if(pid)Object.assign(prop(pid),o);else db.properties.push({id:id('p_'),...o});save();closeModal();render();toast('Property saved')}
function deleteProperty(pid){if(!confirm('Delete this property and its record?'))return;db.properties=db.properties.filter(p=>p.id!==pid);db.maintenance=db.maintenance.filter(m=>m.propertyId!==pid);save();closeModal();render()}
function markPaid(pid){let p=prop(pid);p.lastPaidMonth=monthKey();db.incomes.push({id:id('i_'),date:new Date().toISOString().slice(0,10),propertyId:pid,category:'rent',description:'Rent payment',amount:Number(p.rent||0),frequency:'one-time'});save();render();toast('Rent marked paid')}
function openMaintenance(mid,pid){let m=db.maintenance.find(x=>x.id===mid)||{propertyId:pid||'',necessity:'medium',status:'open',cost:0};openModal(mid?'Edit Repair':'Add Repair',`<form onsubmit="saveMaintenance(event,'${mid||''}')"><div class="formgrid"><div class="field"><label>Property</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${p.id===m.propertyId?'selected':''}>${esc(p.address)}</option>`).join('')}</select></div>${formField('Title','title',m.title)}<div class="field"><label>Urgency</label><select name="necessity">${['emergency','urgent','high','medium','low'].map(x=>`<option ${x===m.necessity?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['open','scheduled','in progress','completed'].map(x=>`<option ${x===m.status?'selected':''}>${x}</option>`).join('')}</select></div>${formField('Estimated/Actual Cost','cost',m.cost,'number')}${formField('Due Date','dueDate',m.dueDate,'date')}${formField('Vendor','vendor',m.vendor)}<div class="field full"><label>Description</label><textarea name="description">${esc(m.description||'')}</textarea></div></div><div class="actions"><button class="btn yellow">Save Repair</button><button type="button" class="btn outline" onclick="closeModal()">Cancel</button></div></form>`)}
function quickRepair(pid){openMaintenance('',pid)}
function saveMaintenance(e,mid){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.cost=Number(o.cost||0);if(mid)Object.assign(db.maintenance.find(m=>m.id===mid),o);else db.maintenance.push({id:id('m_'),...o});save();closeModal();render();toast('Repair saved')}
function completeMaintenance(mid){let m=db.maintenance.find(x=>x.id===mid);m.status='completed';save();render();toast('Repair completed')}
function deleteMaintenance(mid){if(confirm('Delete this repair?')){db.maintenance=db.maintenance.filter(m=>m.id!==mid);save();render()}}
function openExpense(){openModal('Add Accounting Entry',`<form onsubmit="saveExpense(event)"><div class="formgrid">${formField('Date','date',new Date().toISOString().slice(0,10),'date')}<div class="field"><label>Property</label><select name="propertyId"><option value="">All/General</option>${db.properties.map(p=>`<option value="${p.id}">${esc(p.address)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="type"><option>Expense</option><option>Income</option></select></div><div class="field"><label>Category</label><select name="category"><option>rent</option><option>tax</option><option>insurance</option><option>mortgage</option><option>utilities_water</option><option>utilities_sewer</option><option>utilities_garbage</option><option>maintenance</option><option>other</option></select></div>${formField('Description','description')} ${formField('Amount','amount',0,'number')}<div class="field"><label>Frequency</label><select name="frequency"><option>one-time</option><option>monthly</option><option>quarterly</option><option>annual</option></select></div></div><div class="actions"><button class="btn yellow">Save</button><button type="button" class="btn outline" onclick="closeModal()">Cancel</button></div></form>`)}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.amount=Number(o.amount||0);(o.type==='Income'?db.incomes:db.expenses).push({id:id(o.type==='Income'?'i_':'e_'),...o});save();closeModal();render();toast('Entry saved')}
function deleteAccounting(type,idv){if(!confirm('Delete this entry?'))return;let a=type==='Income'?'incomes':'expenses';db[a]=db[a].filter(x=>x.id!==idv);save();render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='batman-ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.properties)throw Error();db=x;save();render();toast('Backup restored')}catch(e){alert('Invalid Batman Ledger backup.')}};r.readAsText(i.files[0])};i.click()}
function exportCSV(){let rows=[['Type','Date','Property','Category','Description','Amount','Frequency']];db.incomes.forEach(x=>rows.push(['Income',x.date,prop(x.propertyId)?.address||'',x.category,x.description,x.amount,x.frequency]));db.expenses.forEach(x=>rows.push(['Expense',x.date,prop(x.propertyId)?.address||'',x.category,x.description,x.amount,x.frequency]));let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='batman-ledger.csv';a.click()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
render();
</script>
</body>
</html>
